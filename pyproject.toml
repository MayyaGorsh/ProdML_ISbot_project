[project]
name = "bot-dialog-classifier"
version = "0.1.0"
description = "Классификация участников диалога для соревнования"
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.8,<2",
    "mlflow>=3.0,<4",
    "numpy>=2.0,<3",
    "polars>=1.0,<2",
    "pydantic>=2.0,<3",
    "scikit-learn>=1.6,<2",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "scipy>=1.18.1",
]

[tool.uv]
package = false
